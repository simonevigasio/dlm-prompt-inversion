# Full pipeline: hidden state after the third complete backbone block -> Stage A -> Stage B.
# Paths are relative to this file.
model: ../model.yaml
stage_a: ../stage_a/levenberg_marquardt.yaml
stage_b: ../stage_b/k100.yaml

# How the hidden state of every --dataset prompt is generated. Prompts come only from
# the dataset file; each is used to create its hidden state and to score the result.
synthetic_observation:
  observation_layer: 3
  noise_seed: 100

# What the attacker knows about the inversion (every flag is optional):
# observed_rows indicates whether the attacker sees all the language rows ("all"), or just the generated ones ("generated")
# knows_noise_scale indicates whether the attacker knows the denoiser noise scale (by default it is 2.0)
# knows_time indicates whether the attacker knows the interpolation time; if False, Stage A recovers it.
#   knows_time: False needs a later sampler call: set `time:` > 0 in synthetic_observation, on a step
#   of the 64-step schedule (e.g. 0.5). At time 0 (the default) the run stops with a ValueError,
#   because the first sampling pass is always at time 0.
attacker_knowledge:
  observed_rows: "generated"
  knows_noise_scale: False

# Runs per prompt. Repetition r of prompt id uses seeds hash(purpose, seed, id, r) for the
# noise and for Stage A/B starts (the seeds above and in the stage files are salts), so no
# seed is shared across prompts or repetitions. Results are keyed by (example_id, repetition).
repetitions: 5
